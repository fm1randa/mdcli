name: Relatório de bug
description: Algo no mdcli não funciona como esperado
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar. Preencha o máximo que puder — quanto mais contexto, mais rápido o diagnóstico.
        **Não cole tokens, senhas, nomes reais de contas, valores financeiros nem outros dados sensíveis.**
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist obrigatório
      description: Confirme antes de enviar.
      options:
        - label: Procurei issues duplicadas (busca por título ou descrição).
          required: true
        - label: Incluí detalhe suficiente para reproduzir (comando exato, ambiente, saída de diagnóstico).
          required: true
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      description: Qual parte do projeto está afetada?
      options:
        - auth
        - entries
        - import
        - accounts
        - cards
        - saída / CLI
        - CI / release
        - docs
        - não sei
    validations:
      required: true
  - type: dropdown
    id: impacto
    attributes:
      label: Impacto
      description: Como o bug afeta seu uso?
      options:
        - bloqueia totalmente
        - degradação grande ou falha frequente
        - bug menor ou ocasional
        - cosmético
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão ou commit
      description: '`mdcli --version` ou o SHA do commit onde o problema ocorreu.'
      placeholder: 2026.10.29 (main @ <commit-sha>)
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Ambiente
      description: SO, versão do Bun, e qualquer detalhe relevante do ambiente.
      placeholder: Linux 6.8, Bun 1.4.2
    validations:
      required: true
  - type: textarea
    id: comando
    attributes:
      label: Comando executado
      description: O comando exato (e flags) que reproduz o problema.
      placeholder: mdcli entries create -a 1002 -d "Compra" -v 10 -c 10 -D 2026-01-05
    validations:
      required: true
  - type: textarea
    id: doctor-or-version
    attributes:
      label: Saída de diagnóstico
      description: "Cole a saída de `mdcli auth doctor` (não existe `mdcli doctor`) ou, se o auth doctor falhar, de `mdcli --version`."
      placeholder: |
        $ mdcli auth doctor
        ...
        # ou
        $ mdcli --version
        2026.10.14
    validations:
      required: true
  - type: textarea
    id: api-payload
    attributes:
      label: Payload / resposta da API (sem dados sensíveis)
      description: Se o bug envolve a API, cole o payload enviado e/ou a resposta (status + corpo), **redigindo tokens, nomes, valores e IDs pessoais**. Prefira `--json` quando existir.
      placeholder: |
        Request: POST /v1/lancamentos { "descricao": "...", "conta": "<id>", ... }
        Response: 400 { "message": "..." }
    validations:
      required: false
  - type: textarea
    id: esperado
    attributes:
      label: Comportamento esperado
      description: O que deveria ter acontecido.
    validations:
      required: true
  - type: textarea
    id: obtido
    attributes:
      label: Comportamento obtido
      description: O que aconteceu de fato (mensagem de erro, saída inesperada, etc.).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs ou saída de terminal
      description: Cole as linhas mais relevantes apenas. Redija dados sensíveis.
      render: shell
      placeholder: |
        $ mdcli entries create ...
        erro: token expirado (linha 127 de src/auth/client.ts)
    validations:
      required: false
  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: Se encontrou uma solução temporária, descreva.
      placeholder: Reiniciar com `mdcli auth refresh` e tentar novamente resolve até o próximo restart.
    validations:
      required: false
  - type: upload
    id: anexos
    attributes:
      label: Capturas, logs ou arquivos de apoio
      description: Upload de capturas de tela, arquivos de log ou arquivos de reprodução. **Redija dados sensíveis antes de enviar.**
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.svg,.mp4,.mov,.webm,.log,.txt,.json,.zip"

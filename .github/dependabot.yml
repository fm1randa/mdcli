# Weekly dependency updates (Jardinagem 2026-10-19: no Dependabot/Renovate).
# Minors and patches come together in one PR per ecosystem (the CI verify
# check validates them); each major gets its own PR, to be reviewed apart.
version: 2
updates:
  # "bun" updates package.json and bun.lock together (lockfile v2 is
  # supported since dependabot-core#16485); "npm" would leave bun.lock stale
  # and break `bun install --frozen-lockfile` in verify.sh.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint (lint step of verify.sh) does not support TS 7 yet
      # ("typescript-eslint does not support TS 7.0", #89). Drop this entry
      # once a typescript-eslint release lists TS 7 in its peer range.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # @types/node follows the Node.js version bundled with Bun, not the
      # newest Node release (#91). Bun 1.4.2 ships Node v26, so package.json
      # pins ^26 and only majors above 26 are ignored here; minors/patches of
      # v26 still arrive in the grouped PR. Bump the major by hand when the
      # Bun version moves (`bun -e 'console.log(process.version)'`).
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Sao_Paulo
    commit-message:
      prefix: chore(ci)
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

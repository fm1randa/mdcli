name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # scripts/verify.sh compares the branch with origin/main to catch a
          # copied eslint-disable, and test/eslint-rules-proof.test.ts reads
          # each rule's motivating commit with git show; the shallow default
          # has neither.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          # Single source of truth: the "packageManager" field in package.json.
          bun-version-file: package.json
      # The install cache survives across runs: `bun install` then only links
      # packages instead of downloading them again.
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Verificação (install, tsc, eslint, knip, testes, CLI)
        # The terminal of a claude.ai container (TERM=linux, forced color):
        # verify.sh must normalize it before its checks run, so dropping that
        # normalization fails here instead of only in the cloud.
        env:
          TERM: linux
          FORCE_COLOR: '1'
          PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/verify.sh

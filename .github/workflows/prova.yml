name: prova

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # The gate reads the scripts the base branch trusts: a PR that edits the
      # proof rule is still judged by the copy it found (#315).
      - name: Check out the gate scripts from the base branch
        env:
          GATE_BASE: ${{ runner.temp }}/gate
        run: |
          git fetch --no-tags origin main
          git worktree add --detach "$GATE_BASE" origin/main
      - name: Prova obrigatória em PR que muda src/
        env:
          GATE_BASE: ${{ runner.temp }}/gate
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          bun "$GATE_BASE/scripts/prova.ts"

name: risco

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The risk classification diffs against the merge base with the base branch.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # The gate reads the scripts the base branch trusts: a PR that edits the
      # classifier or the exemption is still judged by the copy it found (#315).
      - name: Check out the gate scripts from the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
          GATE_BASE: ${{ runner.temp }}/gate
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git worktree add --detach "$GATE_BASE" "origin/$BASE_REF"
          # The write surface resolves names with the TypeScript checker (#357),
          # so the base gate needs its own locked dependencies.
          bun install --frozen-lockfile --cwd "$GATE_BASE"
      - name: Classificar o diff e sincronizar a label `risco`
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          GATE_BASE: ${{ runner.temp }}/gate
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          # A fork PR gets a read-only token, so it only reports the classification.
          CAN_WRITE: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          status=0
          bun "$GATE_BASE/scripts/risk.ts" --base "origin/$BASE_REF" > "$RUNNER_TEMP/risk.json" || status=$?
          if [ "$status" -eq 1 ]; then
            echo "::error::scripts/risk.ts failed to classify the diff"
            exit 1
          fi
          apply=()
          if [ "$CAN_WRITE" = "true" ]; then apply=(--apply); fi
          bun "$GATE_BASE/scripts/risk-label.ts" \
            --report "$RUNNER_TEMP/risk.json" \
            --labels "$PR_LABELS" \
            --pr "$PR_NUMBER" \
            "${apply[@]}" >> "$GITHUB_STEP_SUMMARY"
